<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Page</title>
  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header Animation */
    header {
      text-align: center;
      padding: 2rem;
      animation: fadeInDown 1s ease-out;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    /* Typing Animation */
    .typing-text {
      font-size: 1.5rem;
      margin: 1rem 0;
      min-height: 3rem;
      border-right: 2px solid #fff;
      animation: blink 0.7s infinite;
    }

    /* Blinking Cursor */
    @keyframes blink {
      0%, 100% { border-color: transparent; }
      50% { border-color: #fff; }
    }

    /* Fade-In Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Scroll-Triggered Elements */
    .scroll-animate {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .scroll-animate.animate {
      opacity: 1;
      transform: translateY(0);
    }

    /* Cool Button */
    .cool-button {
      display: inline-block;
      padding: 12px 24px;
      background: #0077b6;
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      margin: 1rem;
    }

    .cool-button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(0, 119, 182, 0.7);
      background: #023e8a;
    }

    /* Floating Animation for Cards */
    .card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 2rem;
      margin: 1.5rem;
      text-align: center;
      backdrop-filter: blur(5px);
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* Section Styling */
    section {
      padding: 4rem 2rem;
      max-width: 1000px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My Animated Page</h1>
    <p class="typing-text" id="typing-text"></p>
  </header>

  <section>
    <h2 class="scroll-animate">Scroll Down to See Magic</h2>
    <p class="scroll-animate">
      This text fades in when you scroll near it! Lorem ipsum dolor sit amet, consectetur adipiscing elit.
    </p>
    <button class="cool-button scroll-animate">Hover Me!</button>
  </section>

  <section>
    <div class="card scroll-animate">
      <h3>Floating Card</h3>
      <p>This card gently floats up and down. Try adding more content here!</p>
    </div>
  </section>

  <script>
    // Typing Animation
    function typeWriter(elementId, text, speed = 50) {
      let i = 0;
      const element = document.getElementById(elementId);
      if (!element) return;

      element.innerHTML = ''; // Clear existing text
      function type() {
        if (i < text.length) {
          element.innerHTML += text.charAt(i);
          i++;
          setTimeout(type, speed);
        }
      }
      type();
    }

    // Scroll Animations
    window.addEventListener('scroll', () => {
      const elements = document.querySelectorAll('.scroll-animate');
      elements.forEach(el => {
        const elementTop = el.getBoundingClientRect().top;
        if (elementTop < window.innerHeight - 100) {
          el.classList.add('animate');
        }
      });
    });

    // Initialize on load
    window.onload = () => {
      typeWriter('typing-text', 'This text is typing itself...');

      // Trigger initial scroll check
      window.dispatchEvent(new Event('scroll'));
    };
  </script>
</body>
</html>
